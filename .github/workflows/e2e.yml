# Playwright e2e tests. They use a fake AI provider, so no API key is needed.
# e2e/live-cors.spec.ts also runs: it sends keyless requests to the three real APIs
# to check the CORS preflight passes. No key means no cost.
name: End-to-end tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
