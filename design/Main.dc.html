<button type="button" style="min-height: 220px; padding: 28px; border: 2px solid #D5DCE8; border-radius: 20px; background: #FFFFFF; color: #17233A; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; font-family: 'Noto Sans KR', sans-serif">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<button type="button" style="min-height: 52px; padding: 0 22px; border: 1px solid #D5DCE8; border-radius: 12px; background: #FFFFFF; color: #17233A; font: 500 17px 'Noto Sans KR', sans-serif">파일 불러오기</button>
<a href="Connect.dc.html" style="display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 22px; border: 1px solid #D5DCE8; border-radius: 12px; background: #FFFFFF; color: #17233A; font-weight: 500; font-size: 17px; text-decoration: none">AI 연결하기<span style="padding: 4px 10px; border-radius: 999px; background: #FFE8D9; color: #8A3206; font-size: 14px; font-weight: 700">아직 연결 안 됨</span></a>
<span style="font-size: 16px; color: #4A5872">연결하지 않아도 글을 직접 쓰고 그림을 올려서 만들 수 있어요.</span>

<span>만든 곳 <strong style="color: #17233A">DI Lab</strong> · Data Insight Lab</span>
